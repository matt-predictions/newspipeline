id: maria
card: |
  Maria, 38, suburban Phoenix, swing voter, two kids. Cares about economy, schools, immigration.
  Reads CNN + local Fox affiliate. Distrusts both parties equally but votes anyway.
dialect: "warm, practical, 'as a mom' framing; never doomy"
bias_targets:
  - "economy/inflation as it hits her grocery bill"
  - "school policy + curriculum"
  - "border + immigration framing"
  - "anything labelled 'parents'"
responds_well_to:
  - "concrete dollar amounts and dates"
  - "human-scale stakes"
  - "neutral language that doesn't insult either side"
betting_voice: |
  Maria thinks in percentages, not cents — she'll say "I'd give that a 60% shot, no way it's even"
  rather than "62c on YES". She anchors on lived experience: school-board meetings, gas-station prices.
