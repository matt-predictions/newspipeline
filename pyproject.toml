[project]
name = "newspipeline"
version = "0.1.0"
description = "News ingest -> cluster -> personas -> debate -> prompt folder + hero image"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "openai>=1.50",
  "httpx>=0.27",
  "feedparser>=6.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "aiosqlite>=0.20",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "apscheduler>=3.10",
  "pyyaml>=6.0",
  "python-slugify>=8.0",
  "numpy>=1.26",
  "Pillow>=10.2",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
